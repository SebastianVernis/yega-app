<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Epilogue%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-[#fcf9f8] justify-between group/design-root overflow-x-hidden"
      style='font-family: Epilogue, "Noto Sans", sans-serif;'
    >
      <div>
        <div class="flex items-center bg-[#fcf9f8] p-4 pb-2 justify-between">
          <div class="text-[#1d120c] flex size-12 shrink-0 items-center" data-icon="ArrowLeft" data-size="24px" data-weight="regular">
            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
              <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
            </svg>
          </div>
          <h2 class="text-[#1d120c] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Vehículo</h2>
        </div>
        <h3 class="text-[#1d120c] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Detalles del vehículo</h3>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#1d120c] text-base font-medium leading-normal pb-2">Tipo de vehículo</p>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#1d120c] focus:outline-0 focus:ring-0 border border-[#ead8cd] bg-[#fcf9f8] focus:border-[#ead8cd] h-14 placeholder:text-[#a16845] p-[15px] text-base font-normal leading-normal"
              value=""
            />
          </label>
        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#1d120c] text-base font-medium leading-normal pb-2">Marca</p>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#1d120c] focus:outline-0 focus:ring-0 border border-[#ead8cd] bg-[#fcf9f8] focus:border-[#ead8cd] h-14 placeholder:text-[#a16845] p-[15px] text-base font-normal leading-normal"
              value=""
            />
          </label>
        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#1d120c] text-base font-medium leading-normal pb-2">Modelo</p>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#1d120c] focus:outline-0 focus:ring-0 border border-[#ead8cd] bg-[#fcf9f8] focus:border-[#ead8cd] h-14 placeholder:text-[#a16845] p-[15px] text-base font-normal leading-normal"
              value=""
            />
          </label>
        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#1d120c] text-base font-medium leading-normal pb-2">Año</p>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#1d120c] focus:outline-0 focus:ring-0 border border-[#ead8cd] bg-[#fcf9f8] focus:border-[#ead8cd] h-14 placeholder:text-[#a16845] p-[15px] text-base font-normal leading-normal"
              value=""
            />
          </label>
        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <p class="text-[#1d120c] text-base font-medium leading-normal pb-2">Placa</p>
            <input
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#1d120c] focus:outline-0 focus:ring-0 border border-[#ead8cd] bg-[#fcf9f8] focus:border-[#ead8cd] h-14 placeholder:text-[#a16845] p-[15px] text-base font-normal leading-normal"
              value=""
            />
          </label>
        </div>
        <h3 class="text-[#1d120c] text-lg font-bold leading-tight tracking-[-0.015em] px-4 pb-2 pt-4">Documentos</h3>
        <div class="flex items-center gap-4 bg-[#fcf9f8] px-4 min-h-14 justify-between">
          <p class="text-[#1d120c] text-base font-normal leading-normal flex-1 truncate">Registro del vehículo</p>
          <div class="shrink-0">
            <div class="text-[#1d120c] flex size-7 items-center justify-center" data-icon="ArrowRight" data-size="24px" data-weight="regular">
              <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                <path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path>
              </svg>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-4 bg-[#fcf9f8] px-4 min-h-14 justify-between">
          <p class="text-[#1d120c] text-base font-normal leading-normal flex-1 truncate">Seguro del vehículo</p>
          <div class="shrink-0">
            <div class="text-[#1d120c] flex size-7 items-center justify-center" data-icon="ArrowRight" data-size="24px" data-weight="regular">
              <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                <path d="M221.66,133.66l-72,72a8,8,0,0,1-11.32-11.32L196.69,136H40a8,8,0,0,1,0-16H196.69L138.34,61.66a8,8,0,0,1,11.32-11.32l72,72A8,8,0,0,1,221.66,133.66Z"></path>
              </svg>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="flex px-4 py-3">
          <button
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 flex-1 bg-[#f95f00] text-[#fcf9f8] text-base font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">Guardar</span>
          </button>
        </div>
        <div class="h-5 bg-[#fcf9f8]"></div>
      </div>
