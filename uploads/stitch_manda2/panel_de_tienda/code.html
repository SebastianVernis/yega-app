            <p class="text-[#a16845] text-base font-normal leading-normal">Hoy</p>

              <div class="border-[#a16845] bg-[#f4ebe6] border-t-2 w-full" style="height: 60%;"></div>
              <p class="text-[#a16845] text-[13px] font-bold leading-normal tracking-[0.015em]">10 AM</p>
              <div class="border-[#a16845] bg-[#f4ebe6] border-t-2 w-full" style="height: 40%;"></div>
              <p class="text-[#a16845] text-[13px] font-bold leading-normal tracking-[0.015em]">12 PM</p>

              <p class="text-[#a16845] text-[13px] font-bold leading-normal tracking-[0.015em]">6 PM</p>

        </div>
