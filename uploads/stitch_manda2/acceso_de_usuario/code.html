<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Epilogue%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-[#fcf9f8] justify-between group/design-root overflow-x-hidden"
      style='font-family: Epilogue, "Noto Sans", sans-serif;'
    >
      <div>
        <div class="flex items-center bg-[#fcf9f8] p-4 pb-2 justify-between">
          <h2 class="text-[#1d120c] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pl-12 pr-12">Bienvenido</h2>
        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <input
              placeholder="Correo electrónico"
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#1d120c] focus:outline-0 focus:ring-0 border-none bg-[#f4ebe6] focus:border-none h-14 placeholder:text-[#a16845] p-4 text-base font-normal leading-normal"
              value=""
            />
          </label>
        </div>
        <div class="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
          <label class="flex flex-col min-w-40 flex-1">
            <input
              placeholder="Contraseña"
              class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#1d120c] focus:outline-0 focus:ring-0 border-none bg-[#f4ebe6] focus:border-none h-14 placeholder:text-[#a16845] p-4 text-base font-normal leading-normal"
              value=""
            />
          </label>
        </div>
        <p class="text-[#a16845] text-sm font-normal leading-normal pb-3 pt-1 px-4 underline">¿Olvidó su contraseña?</p>
        <div class="flex px-4 py-3">
          <button
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 flex-1 bg-[#f95f00] text-[#fcf9f8] text-base font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">Iniciar sesión</span>
          </button>
        </div>
        <div class="flex justify-stretch">
          <div class="flex flex-1 gap-3 flex-wrap px-4 py-3 justify-between">
            <button
              class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#f4ebe6] text-[#1d120c] text-sm font-bold leading-normal tracking-[0.015em]"
            >
              <span class="truncate">Continuar con SearchEngineCo</span>
            </button>
            <button
              class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#f4ebe6] text-[#1d120c] text-sm font-bold leading-normal tracking-[0.015em]"
            >
              <span class="truncate">Continuar con SocialMedia</span>
            </button>
          </div>
        </div>
      </div>
      <div>
        <p class="text-[#a16845] text-sm font-normal leading-normal pb-3 pt-1 px-4 text-center underline">¿No tiene una cuenta? Regístrese</p>
        <div class="h-5 bg-[#fcf9f8]"></div>
      </div>
    </div>
  </body>
</html>
