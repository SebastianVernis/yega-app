<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Epilogue%3Awght%40400%3B500%3B700%3B900&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div
      class="relative flex h-auto min-h-screen w-full flex-col bg-[#fcf9f8] justify-between group/design-root overflow-x-hidden"
      style='font-family: Epilogue, "Noto Sans", sans-serif;'
    >
      <div>
        <div class="@container">
          <div class="@[480px]:px-4 @[480px]:py-3">
            <div
              class="bg-cover bg-center flex flex-col justify-end overflow-hidden bg-[#fcf9f8] @[480px]:rounded-xl min-h-80"
              style='background-image: linear-gradient(0deg, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0) 25%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuBu6zQxx4-BN3lZTRyvPrx1Nsvg6kcK3uhiKY9pz8ovHs2QHYWJuOJqwU1gdbBjAc0bncgOvBPgt3pmV4RnHirP_zZY72oKPBRP5lLvisS4doUT4tWndqNm2lSUbi4l32ZgKwYfek3gNngAWYDSkySnAXQ16fmXKmIElcpfQshG28Tjv2EL2lnvTRyMME4gNAXxla-Ihh6tKaarZ0Vjc3FVB5fASYhP5ZoVPcJNSJGw9qyWcD6_9j7NdmGK_DXjD7OjNlnBHXGPWrg4");'
            >
              <div class="flex justify-center gap-2 p-5">
                <div class="size-1.5 rounded-full bg-[#fcf9f8]"></div>
                <div class="size-1.5 rounded-full bg-[#fcf9f8] opacity-50"></div>
                <div class="size-1.5 rounded-full bg-[#fcf9f8] opacity-50"></div>
                <div class="size-1.5 rounded-full bg-[#fcf9f8] opacity-50"></div>
                <div class="size-1.5 rounded-full bg-[#fcf9f8] opacity-50"></div>
              </div>
            </div>
          </div>
        </div>
        <p class="text-[#1d120c] text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">Recibe tus pedidos de forma rápida y eficiente con nuestra aplicación.</p>
        <div class="flex w-full flex-row items-center justify-center gap-3 py-5">
          <div class="h-2 w-2 rounded-full bg-[#f95f00]"></div>
          <div class="h-2 w-2 rounded-full bg-[#ead8cd]"></div>
          <div class="h-2 w-2 rounded-full bg-[#ead8cd]"></div>
        </div>
      </div>
      <div>
        <div class="flex px-4 py-3">
          <button
            class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 flex-1 bg-[#f95f00] text-[#fcf9f8] text-base font-bold leading-normal tracking-[0.015em]"
          >
            <span class="truncate">Comenzar</span>
          </button>
        </div>
        <div class="h-5 bg-[#fcf9f8]"></div>
      </div>
    </div>
  </body>
</html>
